name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - name: Lint
        run: ruff check --select E,F,W,B,UP --ignore E501 custom_components tests tools
      - name: Translations are up to date
        run: |
          python tools/gen_translations.py
          git diff --exit-code -- custom_components/annke/strings.json custom_components/annke/translations
      - name: Tests
        run: pytest -q
