ptz_move:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: annke
    channel:
      default: 1
      selector:
        number:
          min: 1
          max: 16
    pan:
      default: 0
      selector:
        number:
          min: -100
          max: 100
    tilt:
      default: 0
      selector:
        number:
          min: -100
          max: 100
    zoom:
      default: 0
      selector:
        number:
          min: -100
          max: 100
    duration:
      default: 0.5
      selector:
        number:
          min: 0.1
          max: 10
          step: 0.1
          unit_of_measurement: s

goto_preset:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: annke
    channel:
      default: 1
      selector:
        number:
          min: 1
          max: 16
    preset:
      required: true
      selector:
        number:
          min: 1
          max: 300
